name: Build distribution candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: '1.27.3'
          check-latest: false
      - name: Audit, test and package
        shell: pwsh
        run: ./scripts/distribution.ps1 -OutputDirectory candidate -ProductLicense LICENSE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-amd64-candidate
          path: candidate/*zip*
          if-no-files-found: error
          retention-days: 14
      # Deliberately no release publishing permission or step. See docs/release.md.
